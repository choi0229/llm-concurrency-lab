plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.llmconcurrencylab'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Same Prometheus client library/version as Phase 1 (gateway-mvc-executor-java8)
    // — see docs/test-plan/phase2-design.md section 8 ("metric 이름 동일 유지").
    // This module has no javax/jakarta servlet dependency of its own (verified
    // Unit 1), so it needed no changes for the Jakarta EE migration.
    implementation 'io.prometheus:simpleclient:0.16.0'
    implementation 'io.prometheus:simpleclient_common:0.16.0'
    implementation 'io.prometheus:simpleclient_hotspot:0.16.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
