# Phase 2 Native macOS ARM64 Formal — Prometheus config for the native
# (Docker-free) harness (scripts/run-phase2-native-formal-benchmark.sh).
#
# Job names are IDENTICAL to monitoring/prometheus/prometheus.yml's Phase 2
# job — collect_phase2_formal_result.py hardcodes job="gateway-mvc-java21"
# and is reused unmodified for Native Formal, so this name must not change.
# Targets are localhost (no Docker network/service DNS) — see
# docs/decisions/phase2-formal-native-macos-environment.md section 6.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: gateway-mvc-java21
    static_configs:
      - targets: ["localhost:8080"]

  - job_name: mock-llm-fastapi
    static_configs:
      - targets: ["localhost:8000"]
