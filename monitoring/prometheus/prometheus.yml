# scrape_interval is fixed per docs/decisions/monitoring-baseline.md — do not
# change per-experiment; a different interval is itself an experiment, not a
# baseline setting.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: gateway-mvc-executor-java8
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: mock-llm-fastapi
    static_configs:
      - targets: ["mock-llm:8000"]

  # Phase 2 (docs/test-plan/phase2-formal-protocol.md) — service name/port
  # match docker-compose.yml's gateway-java21 service exactly (SERVER_PORT=8080
  # per gateway-mvc-java21/Dockerfile). Does not touch the Phase 1 job above.
  - job_name: gateway-mvc-java21
    static_configs:
      - targets: ["gateway-java21:8080"]
