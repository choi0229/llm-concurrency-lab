plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.llmconcurrencylab'
version = '0.1.0'

// Runtime frozen in Unit 0 (docs/decisions/phase3-version-compatibility.md):
// Azul Zulu JDK 8 native macOS ARM64. Do not change without reopening that ADR.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // No spring-boot-starter-webflux / WebClient here on purpose — P3-A is the
    // blocking-outbound control (HttpURLConnection only). See
    // docs/decisions/phase3-mvc-webclient-write-path.md and Unit 2 §28 (P3-A
    // must not use WebClient).
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Phase 3 metric contract: Micrometer-only (docs/decisions/phase3-metrics-contract.md §1),
    // not the io.prometheus:simpleclient Phase 1/2 used.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
