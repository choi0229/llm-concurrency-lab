plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.llmconcurrencylab'
version = '0.1.0'

// Runtime frozen Unit 0 (docs/decisions/phase4-runtime.md).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // M1: Servlet/Tomcat + java.net.HttpURLConnection outbound only (docs/test-plan/
    // phase4-design.md section 3). No WebFlux/WebClient/reactor here on purpose.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
